name: Publish NuGet packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version (e.g. 0.5.0)
        required: false
        type: string
      dry_run:
        description: Build, test, and pack for review without publishing to NuGet
        required: false
        type: boolean
        default: true

jobs:
  build-test-pack-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            echo "Unable to resolve version from tag or input."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "❌ Invalid version: '$VERSION'"; exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Publishing version: $VERSION"

      - name: Restore
        run: dotnet restore ElBruno.Speech.sln

      - name: Build
        run: >
          dotnet build ElBruno.Speech.sln
          --configuration Release
          --no-restore
          /p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: >
          dotnet test ElBruno.Speech.sln
          --configuration Release
          --no-build
          --filter "Category!=Integration&Category!=ModelDownload&Category!=Gpu&Category!=WebSocket&Category!=LongRunning"

      - name: Pack
        run: >
          dotnet pack ElBruno.Speech.sln
          --configuration Release
          --no-build
          /p:Version=${{ steps.version.outputs.value }}
          --output ./artifacts/packages

      - name: Verify expected packages
        shell: bash
        run: |
          expected=(
            "ElBruno.Speech.Abstractions"
            "ElBruno.Speech.Audio"
            "ElBruno.Speech.Vad.Silero"
            "ElBruno.Speech.Stt.Parakeet"
            "ElBruno.Speech.Pipeline"
            "ElBruno.Speech.AspNetCore"
            "ElBruno.Speech.NAudio"
            "ElBruno.Speech.OpenTelemetry"
            "ElBruno.Speech.Cli"
            "ElBruno.Speech.BlazorComponents"
          )

          for package in "${expected[@]}"; do
            if [ ! -f "./artifacts/packages/${package}.${{ steps.version.outputs.value }}.nupkg" ]; then
              echo "::error::Expected package was not produced: ${package}"
              exit 1
            fi
          done

          actual_count=$(find ./artifacts/packages -maxdepth 1 -type f -name '*.nupkg' ! -name '*.symbols.nupkg' | wc -l)
          if [ "$actual_count" -ne "${#expected[@]}" ]; then
            echo "::error::Expected ${#expected[@]} packages, found ${actual_count}"
            exit 1
          fi
          echo "✅ Verified ${actual_count} NuGet packages, including ElBruno.Speech.BlazorComponents"

      - name: NuGet login (OIDC → temp API key)
        if: github.event_name == 'release' || !inputs.dry_run
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        if: github.event_name == 'release' || !inputs.dry_run
        run: >
          dotnet nuget push ./artifacts/packages/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/packages/*.nupkg
