name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }}, .NET 8 and 10)
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (8 and 10)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ElBruno.Speech.sln

      - name: Build
        run: dotnet build ElBruno.Speech.sln --configuration Release --no-restore

      - name: Setup Python for offline fixture tooling checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify reusable speech fixtures
        run: |
          python tools/speech-fixtures/fixtures.py verify
          python -m unittest discover -s tools/speech-fixtures -p "test_*.py"
          python -m unittest discover -s tools/speech-benchmark -p "test_*.py"
          python tools/speech-benchmark/check_report.py docs/benchmarks/speech-fixtures-v1/int8.json
          python tools/speech-benchmark/check_report.py docs/benchmarks/speech-fixtures-v1/fp32.json
          python tools/speech-benchmark/check_report.py docs/benchmarks/speech-fixtures-v1/whisper.json
          python tools/speech-benchmark/check_report.py docs/benchmarks/speech-fixtures-v1/whisper-provider.json

      - name: Test
        run: >
          dotnet test ElBruno.Speech.sln
          --configuration Release
          --no-build
          --filter "Category!=Integration&Category!=ModelDownload&Category!=Gpu&Category!=WebSocket&Category!=LongRunning"
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/*.trx"

  pack:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ElBruno.Speech.sln

      - name: Pack
        run: >
          dotnet pack ElBruno.Speech.sln
          --configuration Release
          --no-restore
          --output ./artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/packages/*.nupkg

      - name: Setup Python for fixture archive
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Package reusable fixture archive
        run: |
          python tools/speech-fixtures/fixtures.py pack --output ./artifacts/speech-fixtures
          python -m zipfile -e ./artifacts/speech-fixtures/speech-fixtures-v1.0.0.zip ./artifacts/extracted-fixtures
          python tools/speech-fixtures/fixtures.py verify --bundle ./artifacts/extracted-fixtures

      - name: Upload reusable fixture archive
        uses: actions/upload-artifact@v7
        with:
          name: speech-fixtures-v1.0.0
          path: ./artifacts/speech-fixtures/*
          if-no-files-found: error
